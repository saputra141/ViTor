name: Temporary source export

on:
  push:
    branches:
      - temp/source-export-20261127

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package tracked source
        run: git archive --format=zip HEAD -o /tmp/ViTor-source.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ViTor-source-snapshot
          path: /tmp/ViTor-source.zip
          retention-days: 1
