name: Inspect Gebang application package
on:
  push:
    branches:
      - ops/fetch-wine-gebang-assets-20261127
    paths:
      - .github/workflows/temporary-assemble-test.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare
        run: mkdir -p input assembled extracted payload logs asar-unpacked

      - name: Download verified original assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45920868698 --repo saputra141/ViTor --dir input

      - name: Reassemble and unpack original Gebang package
        shell: bash
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            find "input/gebang-portable-$i" -type f -print0 | sort -z | xargs -0 cat > "assembled/part$i"
          done
          cat assembled/part{0,1,2,3} > assembled/Gebang-Editor-Portable.exe
          test "$(stat -c '%s' assembled/Gebang-Editor-Portable.exe)" = "351939602"
          sudo apt-get update
          sudo apt-get install -y p7zip-full file binutils
          7z x -y -oextracted assembled/Gebang-Editor-Portable.exe
          7z x -y -opayload 'extracted/$PLUGINSDIR/app-64.7z'
          cp payload/resources/app.asar assembled/app.asar
          test -d payload/resources/app.asar.unpacked
          cp -a payload/resources/app.asar.unpacked assembled/app.asar.unpacked
          npx --yes @electron/asar extract assembled/app.asar asar-unpacked

      - name: Fingerprint app source and assets
        shell: bash
        run: |
          set -euo pipefail
          find asar-unpacked -type f -printf '%p %s bytes\n' | sort > logs/asar-files.txt
          find asar-unpacked -maxdepth 3 -type f \( -name 'package.json' -o -name '*.html' -o -name '*.css' -o -name '*.map' \) -print > logs/source-markers.txt
          {
            echo '=== PACKAGE JSON FILES ==='
            find asar-unpacked -name package.json -type f -print -exec sed -n '1,240p' {} \;
            echo '=== SOURCE FILES ==='
            sed -n '1,350p' logs/source-markers.txt
            echo '=== FILE TREE ==='
            sed -n '1,500p' logs/asar-files.txt
            echo '=== WINDOWS-SPECIFIC REFERENCES ==='
            grep -RIlE 'win32|win-x64|license-core|onnxruntime|ffmpeg|electron-store|ipcMain|BrowserWindow|autoUpdater' asar-unpacked --include='*.js' --include='*.json' --include='*.html' --include='*.css' 2>/dev/null | head -n 250 || true
          } | tee logs/asar-summary.txt

      - name: Map Gebang UI, IPC and feature surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/feature-map
          python3 - <<'PY'
          import re, pathlib, collections
          root=pathlib.Path('asar-unpacked/out')
          pats=[r'(?i)timeline|track|clip|transition|keyframe|caption|subtitle|lyrics|audio|video|export|render|effect|filter|sticker|overlay|mask|chroma|green.?screen|remove.?background|background.?remove|depth|portrait|vocal|separat|transcri|speech|asr|whisper|onnx|project|media|import|trim|crop|speed|proxy|waveform',r'(?i)ipcMain|ipcRenderer|contextBridge|exposeInMainWorld|invoke|send|handle|preload']
          files=list(root.rglob('*.js'))+list(root.rglob('*.cjs'))+list(root.rglob('*.cjsc'))
          out=[]
          for p in files:
              try: s=p.read_text(errors='ignore')
              except: continue
              if p.suffix=='.cjsc':
                  out.append(f'## BYTECODE {p} ({p.stat().st_size} bytes)\n')
                  continue
              for pat in pats:
                  hits=collections.Counter(m.group(0) for m in re.finditer(pat,s))
                  if hits:
                      out.append(f'## {p} / {pat}\n'+'\n'.join(f'{k}: {v}' for k,v in hits.most_common(100)))
          pathlib.Path('logs/feature-map/feature-symbols.txt').write_text('\n\n'.join(out))
          PY
          cp asar-unpacked/out/preload/index.js logs/feature-map/preload-index.js
          cp asar-unpacked/out/renderer/index.html logs/feature-map/renderer-index.html
          find asar-unpacked/out/renderer/assets -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort > logs/feature-map/renderer-assets.txt
          grep -RhoE '"(timeline|effects|audio|video|export|render|captions|subtitles|lyrics|transcribe|background|remove|mask|keyframe|transition|media|project)[A-Za-z0-9 _-]{0,40}"' asar-unpacked/out/renderer/assets --include='*.js' | sort -u | head -500 > logs/feature-map/ui-labels.txt || true

      - name: Upload app source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gebang-asar-inspection
          path: logs/
          retention-days: 3
