name: Inspect Gebang application package
on:
  push:
    branches:
      - ops/fetch-wine-gebang-assets-20261127
    paths:
      - .github/workflows/temporary-assemble-test.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare
        run: mkdir -p input assembled extracted payload logs

      - name: Download verified original assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45920868698 --repo saputra141/ViTor --dir input

      - name: Reassemble portable executable
        shell: bash
        run: |
          set -euo pipefail
          for i in 0 1 2 3; do
            find "input/gebang-portable-$i" -type f -print0 | sort -z | xargs -0 cat > "assembled/part$i"
          done
          cat assembled/part{0,1,2,3} > assembled/Gebang-Editor-Portable.exe
          test "$(stat -c '%s' assembled/Gebang-Editor-Portable.exe)" = "351939602"
          sudo apt-get update
          sudo apt-get install -y p7zip-full file binutils
          7z x -y -oextracted assembled/Gebang-Editor-Portable.exe
          test -s 'extracted/$PLUGINSDIR/app-64.7z'

      - name: Extract and fingerprint the actual app payload
        shell: bash
        run: |
          set -euo pipefail
          7z l 'extracted/$PLUGINSDIR/app-64.7z' > logs/app-archive-list.txt
          7z x -y -opayload 'extracted/$PLUGINSDIR/app-64.7z' > logs/app-extract.txt
          find payload -type f -printf '%p %s bytes\n' | sort > logs/payload-files.txt
          find payload -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.node' -o -iname '*.so' \) -print0 | xargs -0 -r file > logs/payload-binaries.txt
          find payload -type f \( -iname 'package.json' -o -iname '*.asar' -o -iname 'electron.asar' -o -iname 'app.asar' -o -iname 'manifest.json' \) -print > logs/package-markers.txt
          grep -RIlE 'electron|chromium|react|vue|angular|tauri|webview2|ffmpeg|sharp|canvas|\.NET|dotnet|qt' payload --include='package.json' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.txt' 2>/dev/null | head -n 100 > logs/technology-files.txt || true
          {
            echo '=== NESTED ARCHIVE ==='
            sed -n '1,180p' logs/app-archive-list.txt
            echo '=== APP FILES ==='
            sed -n '1,260p' logs/payload-files.txt
            echo '=== BINARY TYPES ==='
            cat logs/payload-binaries.txt
            echo '=== PACKAGE MARKERS ==='
            cat logs/package-markers.txt
            echo '=== TECHNOLOGY FILES ==='
            cat logs/technology-files.txt
          } | tee logs/summary.txt

      - name: Upload package inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gebang-package-inspection
          path: logs/
          retention-days: 3
