          retention-days: 2

      - name: Upload Wine stable chunk 4
        uses: actions/upload-artifact@v4
        with:
          name: wine-stable-4
          path: chunks/wine-stable-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Wine staging chunk 4
        uses: actions/upload-artifact@v4
        with:
          name: wine-staging-4
          path: chunks/wine-staging-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Proton chunk 4
        uses: actions/upload-artifact@v4
        with:
          name: wine-proton-4
          path: chunks/wine-proton-04
          if-no-files-found: ignore
