          retention-days: 2

      - name: Upload Gebang portable chunk 4
        uses: actions/upload-artifact@v4
        with:
          name: gebang-portable-4
          path: chunks/gebang-portable-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Wine stable chunk 5
        uses: actions/upload-artifact@v4
        with:
          name: wine-stable-5
          path: chunks/wine-stable-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Wine staging chunk 5
        uses: actions/upload-artifact@v4
        with:
          name: wine-staging-5
          path: chunks/wine-staging-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Proton chunk 5
        uses: actions/upload-artifact@v4
        with:
          name: wine-proton-5
          path: chunks/wine-proton-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2

      - name: Upload Gebang portable chunk 5
        uses: actions/upload-artifact@v4
        with:
          name: gebang-portable-5
          path: chunks/gebang-portable-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 2
      - name: Upload checksums and manifest
        uses: actions/upload-artifact@v4
        with:
          name: asset-checksums
          path: |
            chunks/SHA256SUMS-downloaded.txt
            chunks/wine-11.22-sha256sums.txt
            chunks/wine-proton-11.0-3-sha256sums.txt
          if-no-files-found: error
          retention-days: 2
